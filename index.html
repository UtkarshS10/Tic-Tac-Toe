<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./output.css"> 
</head>
<body class="bg-gray-900 text-white flex justify-center items-center h-screen">

    <!-- Main Container -->
    <div class="flex flex-col items-center gap-6">

        <!-- Title -->
         <h1 class="text-5xl font-bold">Tic Tac Toe</h1>

         <!-- Turn Text -->
          <p id="turnText" class="text-2xl font-semibold">Player 1 Turn</p> 

          <!-- Scoreboard -->
        <div class="flex gap-6 text-2xl font-bold items-center">
        <div id="player1" class="flex gap-2 items-center">
            <input 
                type="text"
                id="playerName1"
                placeholder="Player 1"
                class="border px-2 py-2 w-30 rounded-xl text-white text-lg"/> 
                <span>:<span id="xScore">0</span></span>
            </div>
        <div id="player2" class="flex gap-2 items-center">
            <input 
                type="text"
                id="playerName2"
                placeholder="Player 2"
                class="border px-2 py-2 w-30 rounded-xl text-white text-lg"/>
            <span>:<span id="oScore">0</span></span>
        </div>
        <div id="computer" class="hidden gap-2 items-center">
            <input 
                type="text"
                id="computer"
                placeholder="Computer"
                class="border px-2 py-2 w-30 rounded-xl text-white text-lg"/> 
                <span>:<span id="cScore">0</span></span>
            </div>
        </div>

         <!-- Game Board -->
          <div class="grid grid-cols-3 gap-3">
        
            <!-- Box-1 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700 cursor-pointer"></button> 

             <!-- Box-2 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700 cursor-pointer"></button>

             <!-- Box-3 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700 cursor-pointer"></button>

             <!-- Box-4 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700 cursor-pointer"></button>

             <!-- Box-5 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700 cursor-pointer"></button>

             <!-- Box-6 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700 cursor-pointer"></button>

             <!-- Box-7 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700 cursor-pointer"></button>

             <!-- Box-8 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700 cursor-pointer"></button>

             <!-- Box-9 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700 cursor-pointer"></button>
          </div>

          <!-- Start Game -->
            <button id="startGame" class="flex-row gap-4 bg-blue-600 px-6 py-3 rounded-xl text-xl font-semibold hover:bg-blue-700 cursor-pointer">Start Game</button>

            <!-- Reset Button -->
        <div class="flex gap-4">
           <button id="resetBtn" class="flex-row gap-4 bg-blue-600 px-6 py-3 rounded-xl text-xl font-semibold hover:bg-blue-700 cursor-pointer">Reset Game</button>

           <!-- Reset Score -->
            <button id="resetScoreBtn"
            class="flex-row gap-4 bg-blue-600 px-6 py-3 rounded-xl text-xl font-semibold hover:bg-blue-700 cursor-pointer">Reset Scores</button>
        </div> 
           <!-- Play with Computer -->
           <button id="playWithComputer" class="bg-blue-600 px-6 py-3 rounded-xl text-xl font-semibold  hover:bg-blue-700 cursor-pointer">Play with Computer</button> 
        <div id="level" class="hidden gap-4">
           <button id="level1" class=" bg-blue-600 px-6 py-3 rounded-xl text-xl font-semibold  hover:bg-blue-700 cursor-pointer">Easy</button> 
           <button id="level2" class=" bg-blue-600 px-6 py-3 rounded-xl text-xl font-semibold  hover:bg-blue-700 cursor-pointer">Hard</button> 
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
