<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="output.css"> 
</head>
<body class="bg-gray-900 text-white flex justify-center items-center h-screen">

    <!-- Main Container -->
    <div class="flex flex-col items-center gap-6">

        <!-- Title -->
         <h1 class="text-5xl font-bold">Tic Tac Toe</h1>

         <!-- Turn Text -->
          <p id="turnText" class="text-2xl font-semibold">Player A Turn</p> 

         <!-- Game Board -->
          <div class="grid grid-cols-3 gap-3">
        
            <!-- Box-1 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700"></button>

             <!-- Box-2 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700"></button>

             <!-- Box-3 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700"></button>

             <!-- Box-4 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700"></button>

             <!-- Box-5 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700"></button>

             <!-- Box-6 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700"></button>

             <!-- Box-7 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700"></button>

             <!-- Box-8 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700"></button>

             <!-- Box-9 -->
             <button class="box w-24 h-24 bg-gray-800 rounded-xl text-4xl font-bold hover:bg-gray-700"></button>
          </div>

          <!-- Reset Button -->
           <button id="resetBtn" class="bg-blue-600 px-6 py-3 rounded-xl text-xl font-semibold hover:bg-blue-700">Reset Game</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
